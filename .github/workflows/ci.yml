name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci

      - name: Oxlint
        run: pnpm exec oxlint

      # LayoutProps/PageProps live in .next/types, which a fresh checkout lacks
      - name: Type check
        run: pnpm exec next typegen && pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs gate only on findings they introduce; pushes to main run the full analysis
      - uses: fallow-rs/fallow@v3
        with:
          command: ${{ github.event_name == 'pull_request' && 'audit' || '' }}
