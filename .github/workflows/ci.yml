name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow audit needs the base branch history to diff against
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci

      - name: Oxlint
        run: pnpm exec oxlint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Fallow
        run: pnpm exec fallow --format github-annotations

      - name: Fallow audit
        if: github.event_name == 'pull_request'
        run: pnpm exec fallow audit --base origin/${{ github.base_ref }} --format github-annotations

      - name: Build
        run: pnpm build
